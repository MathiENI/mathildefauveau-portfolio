<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    BackLab Favicon — 32×32
    Simplified 5-arm asterisk/K-hybrid mark.
    Flat gradient for legibility at small sizes.
  -->
  <defs>
    <linearGradient id="fg" x1="0" y1="32" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="50%"  stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <g stroke="url(#fg)" stroke-width="5" stroke-linecap="round">
    <!-- Long left arm -->
    <line x1="17" y1="16" x2="2"  y2="16"/>
    <!-- Upper-left diagonal -->
    <line x1="17" y1="16" x2="6"  y2="5"/>
    <!-- Lower-left diagonal -->
    <line x1="17" y1="16" x2="6"  y2="27"/>
    <!-- Upper-right short -->
    <line x1="17" y1="16" x2="24" y2="9"/>
    <!-- Lower-right short -->
    <line x1="17" y1="16" x2="24" y2="23"/>
  </g>
</svg>
