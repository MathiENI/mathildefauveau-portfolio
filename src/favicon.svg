<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    BackLab Favicon — 32×32
    Simplified B for maximum legibility at small sizes.
    Return notch omitted (too small to render cleanly at 16-32px).
    Flat blue #4da6ff — no gradient for consistent browser rendering.
  -->
  <rect width="32" height="32" rx="7" fill="#4da6ff"/>
  <!--
    B path scaled from 56×56 icon (~0.571 scale):
    Spine: x=7–12, y=6–26
    Upper arc: rx=9  ry=5 from (12,6)  to (12,16) — semicircle
    Lower arc: rx=10 ry=6 from (12,16) to (12,26) — semicircle, slightly larger
  -->
  <path
    d="M7 6
       L12 6
       A9 5  0 0 1 12 16
       A10 6 0 0 1 12 26
       L7 26
       Z"
    fill="white"
  />
</svg>
