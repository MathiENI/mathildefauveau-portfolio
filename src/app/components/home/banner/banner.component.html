<section class="section banner">
    <div class="banner-overlay"></div>

    <div class="container">
        <div class="section-box-banner">
            <div class="content">
                <div class="banner-pretitle">
                    <h1>{{"Banner.Pretitle" | translate}}</h1>
                </div>
                <div class='banner-title'>
                    <h2 class="banner-name">{{"Banner.Title" | translate}}</h2>
                    <h3 [innerHTML]='"Banner.Subtitle" | translate' class="banner-subtitle"></h3>
                </div>
                <div class='banner-description'>
                    <p [innerHTML]='"Banner.Description" | translate' class="mt-4"></p>
                </div>
            </div>
            <div class="div-btn-banner">
                <app-dynamic-button
                    [text]='"Banner.ActionBtn" | translate'
                    href="#products"
                    target="_self"
                    analyticsEvent="click_products"
                    analyticsCategory="banner"
                    analyticsLabel="discover_products"
                    variant="primary">
                </app-dynamic-button>
                <app-dynamic-button
                    [text]='"Banner.ActionBtn2" | translate'
                    href="mailto:contact@backlab.com"
                    target="_blank"
                    analyticsEvent="click_contact"
                    analyticsCategory="banner"
                    analyticsLabel="talk_need"
                    variant="secondary">
                </app-dynamic-button>
            </div>
        </div>
    </div>
</section>
