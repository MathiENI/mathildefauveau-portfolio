<section class="section services-section" id="services">
  <div class="container">
    <div class="section-box">

      <div data-aos="fade-up" data-aos-duration="1000">
        <h3 class="section-title">
          <span class="n-section-title">04.</span>
          {{ "Services.Title" | translate }}
        </h3>
        <p class="section-subtitle">{{ "Services.Subtitle" | translate }}</p>
      </div>

      <div class="services-grid">
        <div
          *ngFor="let service of 'Services.Items' | translate; let i = index"
          class="service-card"
          data-aos="fade-up"
          data-aos-duration="700"
          [attr.data-aos-delay]="100 + (i * 80)">

          <div class="service-icon">{{ service.Icon }}</div>
          <h4 class="service-title">{{ service.Title }}</h4>
          <p class="service-desc">{{ service.Description }}</p>
        </div>
      </div>

      <div class="services-cta" data-aos="fade-up" data-aos-duration="800" data-aos-delay="600">
        <p class="services-cta-text">Vous avez un besoin précis ? Un projet à lancer ? Parlons-en.</p>
        <app-dynamic-button
          [text]='"Services.Cta" | translate'
          href="mailto:contact@backlab.com"
          target="_blank"
          analyticsEvent="click_services_cta"
          analyticsCategory="services"
          analyticsLabel="contact"
          variant="primary">
        </app-dynamic-button>
      </div>

    </div>
  </div>
</section>
