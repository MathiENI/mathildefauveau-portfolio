<section class="section products-section" id="products">
  <div class="container">
    <div class="section-box">

      <div class="about-title mb-4" data-animate="slideInUp" data-animate-duration="1000">
        <h3 class="section-title">
          <span class="n-section-title">03.</span>
          {{ "Products.Title" | translate }}
        </h3>
        <p class="section-subtitle">{{ "Products.Subtitle" | translate }}</p>
      </div>

      <div class="products-grid">
        <div
          *ngFor="let product of 'Products.Items' | translate; let i = index"
          class="product-card"
          data-animate="fadeInUp"
          [attr.data-animate-delay]="200 + (i * 120)"
          data-animate-duration="700">

          <div class="product-header">
            <span class="product-icon">{{ product.Icon }}</span>
            <span class="product-status">{{ product.Status }}</span>
          </div>

          <h4 class="product-name">{{ product.Name }}</h4>
          <p class="product-tagline">{{ product.Tagline }}</p>
          <p class="product-desc">{{ product.Description }}</p>

          <div class="product-footer">
            <span class="product-cta">Bientôt disponible →</span>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
