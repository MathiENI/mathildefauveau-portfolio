<section class="section about" id="about">

    <!-- SECTION PROBLÈME -->
    <div class="container">
        <div class="section-box">
            <div class="about-title" data-animate="slideInUp" data-animate-duration="1000">
                <h3 class="section-title">
                    <span class='n-section-title'>01.</span> {{"Problem.Title" | translate}}
                </h3>
                <p class="section-subtitle" data-animate="fadeInLeft" data-animate-delay="200" data-animate-duration="800">
                    {{"Problem.Subtitle" | translate}}
                </p>
            </div>

            <div class="problem-grid">
                <div *ngFor="let item of 'Problem.Items' | translate; let i = index"
                     class="problem-card"
                     data-animate="fadeInUp"
                     [attr.data-animate-delay]="200 + (i * 150)"
                     data-animate-duration="700">
                    <div class="problem-icon">{{ item.Icon }}</div>
                    <h4 class="problem-title">{{ item.Title }}</h4>
                    <p class="problem-desc">{{ item.Description }}</p>
                </div>
            </div>
        </div>
    </div>

    <!-- SECTION VISION -->
    <div class="container" id="vision">
        <div class="section-box vision-box">
            <div data-animate="slideInUp" data-animate-duration="1000">
                <h3 class="section-title">
                    <span class='n-section-title'>02.</span> {{"Vision.Title" | translate}}
                </h3>
            </div>
            <div class="vision-manifesto"
                 data-animate="morphIn"
                 data-animate-delay="300"
                 data-animate-duration="1000">
                <blockquote [innerHTML]='"Vision.Manifesto" | translate'></blockquote>
            </div>
        </div>
    </div>

</section>
