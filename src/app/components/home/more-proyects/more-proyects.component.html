<div>

  <!-- ── SECTION FOUNDER ──────────────────────────── -->
  <section class="section founder-section" id="founder">
    <div class="container">
      <div class="section-box">
        <div data-aos="fade-up" data-aos-duration="1000">
          <h3 class="section-title">
            <span class="n-section-title">05.</span>
            {{ "Founder.Title" | translate }}
          </h3>
        </div>

        <div class="founder-content">
          <div class="founder-text" data-aos="fade-right" data-aos-duration="900" data-aos-delay="150">
            <p *ngFor="let para of 'Founder.Paragraphs' | translate"
               [innerHTML]="para"
               class="founder-para">
            </p>
            <div class="founder-identity">
              <span class="founder-name">{{ "Founder.Name" | translate }}</span>
              <span class="founder-role">{{ "Founder.Role" | translate }}</span>
            </div>
          </div>

          <div class="founder-visual" data-aos="fade-left" data-aos-duration="900" data-aos-delay="250">
            <div class="founder-card">
              <div class="founder-avatar">
                <img src="assets/images/couv.png"
                     alt="Mathilde Fauveau — BackLab"
                     class="founder-img" />
              </div>
              <div class="founder-badge">
                <span class="badge-icon">⚡</span>
                <span class="badge-text">BackLab Solutions</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── SECTION FAQ ──────────────────────────────── -->
  <section class="section faq-section" id="faq">
    <div class="container">
      <div class="section-box">
        <div data-aos="fade-up" data-aos-duration="1000">
          <h3 class="section-title">
            <span class="n-section-title">06.</span>
            {{ "FAQ.Title" | translate }}
          </h3>
        </div>

        <div class="faq-list">
          <div
            *ngFor="let item of 'FAQ.Items' | translate; let i = index"
            class="faq-item"
            [class.faq-open]="openIndex === i"
            (click)="toggle(i)"
            data-aos="fade-up"
            data-aos-duration="600"
            [attr.data-aos-delay]="i * 80">

            <div class="faq-question">
              <span>{{ item.Question }}</span>
              <span class="faq-arrow">{{ openIndex === i ? '−' : '+' }}</span>
            </div>
            <div class="faq-answer" *ngIf="openIndex === i">
              <p>{{ item.Answer }}</p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>

</div>
