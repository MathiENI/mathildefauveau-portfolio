<footer>
    <div [@animateFooter]>
        <!-- Barre gauche — réseaux -->
        <ul class="footer-left-bar d-none d-md-block">
            <li>
                <a (click)='analyticsService.sendAnalyticEvent("click_linkedin", "footer", "linkedin")'
                   href="https://www.linkedin.com/in/mathilde-fauveau"
                   target='_blank'
                   aria-label="LinkedIn">
                    <i class="fab fa-linkedin-in"></i>
                </a>
            </li>
        </ul>

        <!-- Barre droite — email -->
        <div class="footer-right-bar d-none d-md-block">
            <a (click)='analyticsService.sendAnalyticEvent("click_send_mail", "footer", "email")'
               href="mailto:contact@backlab.com"
               target='_blank'>
               contact&#64;backlab.com
            </a>
        </div>
    </div>

    <!-- Footer central -->
    <div class="footer-credits text-center">
        <a routerLink="/" class="footer-logo">
            <img src="assets/icons/logo-backlab-icon.svg" alt="BackLab" width="28" height="28" class="footer-logo-icon">
            <span class="footer-logo-name">BackLab Solutions</span>
        </a>
        <nav class="footer-nav">
            <a href="#products">Produits</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
        <div class="footer-divider"></div>
        <nav class="footer-nav footer-nav--legal">
            <a routerLink="/mentions-legales">Mentions légales</a>
            <a routerLink="/politique-confidentialite">Politique de confidentialité</a>
            <a routerLink="/charte-backlab">Charte BackLab</a>
        </nav>
        <div class="footer-copy">
            <span class="footer-copy-left">© {{ currentYear }} BackLab Solutions — Tous droits réservés</span>
            <span class="footer-copy-right">
                Fait avec ❤️ · Made in Limoges
            </span>
        </div>
    </div>
</footer>
