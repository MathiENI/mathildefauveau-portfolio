<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BackLab">
  <!--
    BackLab Icon v3.0 — reproduction fidèle du favicon à l'échelle ×3.75
    5-arm K-hybrid, centre (64,60), fond transparent.
    Dégradé cyan #00d4ff (bas-gauche) → bleu #4da6ff → violet #8B5CF6 (haut-droite).
  -->
  <defs>
    <linearGradient id="ig" x1="0" y1="120" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="50%"  stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <g stroke="url(#ig)" stroke-width="19" stroke-linecap="round">
    <!-- Bras gauche long -->
    <line x1="64" y1="60" x2="8"  y2="60"/>
    <!-- Diagonale haut-gauche -->
    <line x1="64" y1="60" x2="23" y2="19"/>
    <!-- Diagonale bas-gauche -->
    <line x1="64" y1="60" x2="23" y2="101"/>
    <!-- Court haut-droite -->
    <line x1="64" y1="60" x2="90" y2="34"/>
    <!-- Court bas-droite -->
    <line x1="64" y1="60" x2="90" y2="86"/>
  </g>
</svg>
