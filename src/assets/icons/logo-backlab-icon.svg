<svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BackLab">
  <!--
    BackLab B Monogram — v1.0
    ─────────────────────────────────────────────────────────────────
    Construction:
      Spine    x=12–20, y=10–46  (8px wide, 36px tall)
      Upper D  arc rx=15 ry=9    from (20,10) → (20,28)  clockwise
      Lower D  arc rx=17 ry=10   from (20,28) → (24,46)  clockwise
      Return   V-notch at base   (24,46)→(22,43)→(20,46)

    The V-notch encodes the brand concept:
    recovering lost opportunities, returning what was missed.
    At small sizes it reads as a clean B.
    At large sizes the return indicator is intentional.

    Colors:
      Badge gradient  #5ab3ff → #3892e8  (BackLab blue)
      Monogram        #ffffff
  ─────────────────────────────────────────────────────────────────
  -->
  <defs>
    <linearGradient id="bl-bg" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#5ab3ff"/>
      <stop offset="100%" stop-color="#3892e8"/>
    </linearGradient>
  </defs>

  <!-- Badge: blue gradient rounded square -->
  <rect width="56" height="56" rx="11" fill="url(#bl-bg)"/>

  <!--
    B monogram — single filled path:
    Spine + upper D-bowl + lower D-bowl + return V-notch
  -->
  <path
    d="M12 10
       L20 10
       A15 9  0 0 1 20 28
       A17 10 0 0 1 24 46
       L22 43
       L20 46
       L12 46
       Z"
    fill="white"
  />
</svg>
