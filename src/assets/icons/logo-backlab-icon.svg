<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BackLab">
  <!--
    BackLab Icon — 8-arm asterisk mark — v3.0
    8 arms from center (100,100) with round caps.
    Right 3 arms are long (forming the K/>  shape).
    Left 3 arms are short (teardrops/pills).
    Top & bottom are medium.
    Gradient: violet #7B5CF6 (upper-left) → cyan #00D4FF (lower-right).
    Transparent background.
  -->
  <defs>
    <linearGradient id="g" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#7B5CF6"/>
      <stop offset="55%"  stop-color="#5B7AF6"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>
  <g stroke="url(#g)" stroke-width="20" stroke-linecap="round">
    <!-- Right — long -->
    <line x1="100" y1="100" x2="163" y2="100"/>
    <!-- Upper-right — long (45°) -->
    <line x1="100" y1="100" x2="144" y2="56"/>
    <!-- Lower-right — long (315°) -->
    <line x1="100" y1="100" x2="144" y2="144"/>
    <!-- Up — medium -->
    <line x1="100" y1="100" x2="100" y2="44"/>
    <!-- Down — medium -->
    <line x1="100" y1="100" x2="100" y2="156"/>
    <!-- Upper-left — short teardrop (135°) -->
    <line x1="100" y1="100" x2="77"  y2="77"/>
    <!-- Left — short pill (180°) -->
    <line x1="100" y1="100" x2="67"  y2="100"/>
    <!-- Lower-left — short teardrop (225°) -->
    <line x1="100" y1="100" x2="77"  y2="123"/>
  </g>
</svg>
