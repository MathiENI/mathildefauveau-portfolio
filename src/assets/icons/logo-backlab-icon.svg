<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BackLab">
  <!--
    BackLab Icon — Asterisk/K-hybrid mark — v2.0
    5 arms radiating from center (62, 60):
      · Long horizontal left arm
      · Upper-left diagonal
      · Lower-left diagonal
      · Upper-right short arm
      · Lower-right short arm
    Gradient: cyan #00d4ff → blue #4da6ff → purple #8B5CF6
    Transparent background — no badge.
  -->
  <defs>
    <linearGradient id="ig" x1="0" y1="120" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="50%"  stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <g stroke="url(#ig)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Long horizontal left arm -->
    <line x1="62" y1="60" x2="8"  y2="60"/>
    <!-- Upper-left diagonal arm -->
    <line x1="62" y1="60" x2="22" y2="20"/>
    <!-- Lower-left diagonal arm -->
    <line x1="62" y1="60" x2="22" y2="100"/>
    <!-- Upper-right short arm -->
    <line x1="62" y1="60" x2="86" y2="36"/>
    <!-- Lower-right short arm -->
    <line x1="62" y1="60" x2="86" y2="84"/>
  </g>
</svg>
