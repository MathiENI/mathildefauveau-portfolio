<svg viewBox="0 0 520 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BackLabs">
  <!--
    BackLab Full Logo — horizontal lock-up — v2.0
    Icon: 5-arm asterisk/K-hybrid, cyan→blue→purple gradient, transparent bg
    Wordmark: "BackLabs" in SF Mono white
    Dot: blue filled circle
  -->
  <defs>
    <linearGradient id="ig-l" x1="0" y1="120" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#00d4ff"/>
      <stop offset="50%"  stop-color="#4da6ff"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- ── Icon (120×120) ─────────────────────────────── -->
  <g stroke="url(#ig-l)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <line x1="62" y1="60" x2="8"  y2="60"/>
    <line x1="62" y1="60" x2="22" y2="20"/>
    <line x1="62" y1="60" x2="22" y2="100"/>
    <line x1="62" y1="60" x2="86" y2="36"/>
    <line x1="62" y1="60" x2="86" y2="84"/>
  </g>

  <!-- ── Wordmark: "BackLabs" in SF Mono white ─────── -->
  <text
    x="136" y="60"
    dominant-baseline="middle"
    font-family="'SF Mono', SFMono-Regular, ui-monospace, 'Cascadia Mono', 'Fira Code', monospace"
    font-size="56"
    font-weight="600"
    letter-spacing="-1"
    fill="white">BackLabs</text>

  <!-- ── Blue dot ───────────────────────────────────── -->
  <circle cx="500" cy="78" r="13" fill="#4da6ff"/>
</svg>
